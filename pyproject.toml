[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eden"
version = "0.2.0"
description = "RavensAI EDEN multi-agent platform, incl. EDEN Grid Sentinel (Meta Global AI Developer Hackathon 2026)"
requires-python = ">=3.11,<3.14"
# Core: enough for the Grid Sentinel API and contracts
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
# Sense/Think/Learn/Act pipeline (Firebase RTDB + Pub/Sub + ML)
pipeline = [
  "pydantic-settings>=2.4,<3.0",
  "pandas",
  "numpy",
  "scikit-learn",
  "firebase-admin",
  "google-cloud-pubsub==2.21.5",
]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
